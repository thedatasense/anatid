name: release

# Fires only when a GitHub Release is published, never on a plain tag push,
# so tagging a commit can never publish by accident.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      target:
        description: "Where to upload"
        required: true
        default: testpypi
        type: choice
        options: [testpypi, pypi]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade build twine
      - run: python -m build
      - run: python -m twine check dist/*
      # Prove the wheel imports and works before anything is uploaded.
      - name: Smoke test the built wheel
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install --quiet dist/*.whl
          /tmp/smoke/bin/python -c "
          from anatid import Anatid
          with Anatid.open(':memory:', tenant=1, embedding_dim=4) as db:
              m = db.remember('hello', entities=['Ada'], embedding=[0,0,0,1.0])
              assert db.recall_2hop('Ada')[0].memory_id == m.memory_id
          print('smoke test passed')
          "
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: release
    # Trusted publishing: no API token is stored anywhere. Configure the
    # publisher once at https://pypi.org/manage/account/publishing/ with
    # owner thedatasense, repo anatid, workflow release.yml, environment release.
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publish to TestPyPI
        if: github.event_name == 'workflow_dispatch' && inputs.target == 'testpypi'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
      - name: Publish to PyPI
        if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.target == 'pypi')
        uses: pypa/gh-action-pypi-publish@release/v1
