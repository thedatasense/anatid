name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install anatid with every extra
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[agents,mcp,dev]"

      - name: Show versions
        run: |
          python -c "import anatid, duckdb, sys; print('python', sys.version); print('anatid', anatid.__version__); print('duckdb', duckdb.__version__)"

      # The spike dataset is not in the repository, so the slow/oracle tests that load it
      # cannot run here; they are run locally against spike/data before a release. The C++
      # extension is not built here either, so tests/test_extension.py skips itself. Everything
      # else runs -- including the MCP and OpenAI-Agents suites, which is why the install step
      # above pulls in both extras rather than `[dev]` alone.
      - name: Run tests
        run: pytest -m "not slow and not oracle"

      - name: Run the quickstart example
        run: python examples/quickstart.py
